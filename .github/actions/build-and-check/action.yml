name: Build and quality checks
description: Build tools and product before read-only checks
inputs:
  skip-build:
    description: Reuse the exact commit's package artifacts on the same platform
    default: "false"
runs:
  using: composite
  steps:
    - shell: bash
      if: inputs.skip-build != 'true'
      run: pnpm run build
    - shell: bash
      run: pnpm run format:check
    - shell: bash
      run: pnpm run lint:check
    - shell: bash
      run: pnpm run typecheck
    - shell: bash
      run: pnpm run check
    - shell: bash
      run: pnpm run lint:packages

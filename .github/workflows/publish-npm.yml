name: Publish Limina
"on":
  workflow_dispatch:
    inputs:
      tag:
        description: Approved new limina/v<version> tag for both packages
        required: true
        type: string
permissions:
  contents: read
jobs:
  publish:
    if: github.repository == 'senaoxi/limina' && vars.LIMINA_RELEASE_ENABLED == '1'
    runs-on: ubuntu-latest
    environment: Release
    permissions:
      contents: write
      id-token: write
    env:
      LIMINA_RELEASE_ENABLED: "1"
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - uses: ./.github/actions/setup-env
        with:
          node-version: 24.11.0
      - name: Reject historical tags and require the tagged commit on main
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          pnpm run release:check-tag
      - name: Build and run read-only quality gates
        uses: ./.github/actions/build-and-check
      - run: pnpm run test && pnpm run test:smoke && pnpm run typecheck && pnpm run check && pnpm run lint:packages
      - name: Audit dependencies before publication
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .reports/security
          pnpm audit --audit-level high | tee .reports/security/audit.txt
      - name: Publish the approved same-version group with provenance
        run: pnpm exec tsx scripts/release/publish-approved.ts
      - name: Create GitHub release after both npm packages are available
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .reports/release
          endpoint="repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG//\//%2F}"
          if gh api "$endpoint" > .reports/release/release.json 2> .reports/release/lookup.log; then
            jq -e '.tag_name == env.RELEASE_TAG and .draft == false' .reports/release/release.json > /dev/null
          else
            if [[ "$(cat .reports/release/lookup.log)" != *"(HTTP 404)"* ]]; then
              echo "GitHub release lookup failed." >&2
              exit 1
            fi
            release_commit="$(git rev-parse HEAD)"
            body="See the [shared changelog for Limina and limina-migrate](https://github.com/${GITHUB_REPOSITORY}/blob/${release_commit}/packages/limina/CHANGELOG.md)."
            args=("${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --verify-tag --title "${RELEASE_TAG}" --notes "$body")
            if [[ "${RELEASE_TAG#limina/v}" == *-* ]]; then
              args+=(--prerelease)
            fi
            gh release create "${args[@]}"
          fi
      - name: Retain release evidence even if an external step fails
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: approved-release-evidence
          path: .reports/**
          include-hidden-files: true
          retention-days: 30

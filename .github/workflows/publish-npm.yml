name: Publish Limina
"on":
  workflow_dispatch:
    inputs:
      tag:
        description: Approved new limina/v<version> tag for both packages
        required: true
        type: string
permissions:
  contents: read
jobs:
  publish:
    if: vars.LIMINA_RELEASE_ENABLED == '1'
    runs-on: ubuntu-latest
    environment: Release
    permissions:
      contents: read
      id-token: write
    env:
      LIMINA_RELEASE_ENABLED: "1"
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - uses: ./.github/actions/setup-env
        with:
          node-version: 24.11.0
      - run: pnpm run test && pnpm run test:smoke && pnpm run typecheck && pnpm run check && pnpm run lint:packages
      - name: Publish the approved same-version group with provenance
        run: pnpm exec tsx scripts/release/publish-approved.ts

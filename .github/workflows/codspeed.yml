name: CodSpeed
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: codspeed-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  benchmarks:
    name: CodSpeed benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      # CodSpeed authenticates the upload with an OIDC token instead of a secret.
      id-token: write
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - uses: ./.github/actions/setup-env
      - uses: CodSpeedHQ/action@b1f28b5eccf7cb5bfe6a2a89cb3053eb67f1150c # v5.8.0
        with:
          mode: simulation
          run: pnpm bench

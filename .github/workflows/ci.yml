name: CI
env:
  NODE_OPTIONS: --max-old-space-size=4096
  NODE_VERSION: 22.18.0
  FORCE_COLOR: 1
permissions:
  contents: read
  actions: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build-artifacts:
    name: Build Artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - name: Setup Environment
        uses: ./.github/actions/setup-env
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Build tools and both public packages
        run: pnpm run build
      - name: Check infrastructure configuration
        run: pnpm run infrastructure:check
      - name: Measure tarballs and generate license reports and SBOMs
        run: pnpm run artifacts:report
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-artifact-reports
          path: .reports/release/**
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: packages-build-artifacts
          path: packages/*/dist/**
          retention-days: 1
  limina-vue-semantic-matrix:
    name: Limina Vue semantic matrix
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - name: Setup Environment
        uses: ./.github/actions/setup-env
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: packages-build-artifacts
          path: packages
      - name: Install exact Vue checker tuples
        run: pnpm --dir packages/limina/fixtures/vue-semantic-matrix install --frozen-lockfile --ignore-scripts
      - name: Verify Vue semantic adapter families
        run: pnpm --dir packages/limina/fixtures/vue-semantic-matrix matrix
    needs:
      - build-artifacts
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    needs: build-artifacts
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - name: Setup Environment
        uses: ./.github/actions/setup-env
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: packages-build-artifacts
          path: packages
      - name: Build and Quality Check
        uses: ./.github/actions/build-and-check
        with:
          skip-build: "true"
  test:
    name: Test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux / Node 22.18
            os: ubuntu-latest
            node: 22.18.0
          - name: Linux / Node 24.11
            os: ubuntu-latest
            node: 24.11.0
          - name: macOS / Node 22.18
            os: macos-latest
            node: 22.18.0
          - name: Windows / Node 22.18
            os: windows-latest
            node: 22.18.0
          - name: Linux / Node 24 Latest
            os: ubuntu-latest
            node: 24
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - name: Setup Environment
        uses: ./.github/actions/setup-env
        with:
          node-version: ${{ matrix.node }}
      - name: Build and Quality Check
        uses: ./.github/actions/build-and-check
      - name: Unit Tests
        run: pnpm --filter limina run test:unit --reporter=default --reporter=junit --outputFile=../../.smoke/test-results/limina-unit.xml && pnpm --filter limina-migrate run test:unit --reporter=default --reporter=junit --outputFile=../../.smoke/test-results/migrate-unit.xml && pnpm run test:tooling
      - name: Limina Integration Tests
        run: pnpm --filter limina run test:integration --reporter=default --reporter=junit --outputFile=../../.smoke/test-results/limina-integration.xml && pnpm --filter limina-migrate run test:integration --reporter=default --reporter=junit --outputFile=../../.smoke/test-results/migrate-integration.xml
      - name: Upload Test Results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: test-results-${{ matrix.os }}-${{ matrix.node }}
          path: .smoke/test-results/**
          include-hidden-files: true
          retention-days: 7
        if: failure()
  limina-atomic-writer-windows:
    name: Limina Windows behavior (Node ${{ matrix.node }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        node:
          - 22.18.0
          - 24.11.0
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - name: Setup Environment
        uses: ./.github/actions/setup-env
        with:
          node-version: ${{ matrix.node }}
      - name: Atomic writer, path, shell, and migration transaction unit tests
        run: pnpm --filter limina run test:unit src/__tests__/atomic-writer.spec.ts src/__tests__/path-filters.spec.ts src/__tests__/shell-command.spec.ts src/__tests__/standalone-invocation-command.spec.ts src/__tests__/migration-forward.spec.ts && pnpm --filter limina-migrate run test:unit src/__tests__/migration-transaction.spec.ts
      - name: Build packed Limina
        run: pnpm run build
      - name: Standalone generated-command tarball round-trip
        run: pnpm --dir smoke exec vitest run generated-command.spec.ts migration.spec.ts
  limina-platform-build-smoke:
    name: Limina build and smoke (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux / Node 22.18
            os: ubuntu-latest
            node: 22.18.0
          - name: Linux / Node 24.11
            os: ubuntu-latest
            node: 24.11.0
          - name: macOS / Node 24.11
            os: macos-latest
            node: 24.11.0
          - name: Windows / Node 24.11
            os: windows-latest
            node: 24.11.0
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - name: Setup Environment
        uses: ./.github/actions/setup-env
        with:
          node-version: ${{ matrix.node }}
      - name: Build Limina
        run: pnpm run build
      - name: Smoke Test Limina
        run: pnpm run test:smoke
  build:
    name: Build Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - name: Setup Environment
        uses: ./.github/actions/setup-env
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Download Build Artifacts
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: packages-build-artifacts
          path: packages
      - name: Build Docs
        run: pnpm docs:build
      - name: Upload Docs Artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: docs-dist
          path: docs/.vitepress/dist
          retention-days: 1
    needs:
      - build-artifacts
  status:
    name: CI Status
    runs-on: ubuntu-latest
    needs:
      - build-artifacts
      - limina-vue-semantic-matrix
      - quality
      - test
      - limina-atomic-writer-windows
      - limina-platform-build-smoke
      - build
    if: always()
    steps:
      - name: Check Status
        env:
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
        run: "if [[ \"$FAILED\" == \"true\" ]]; then\n  echo \"\u274C CI Failed\"\n  exit 1\nelse\n  echo \"\u2705 CI Passed\"\nfi\n"
"on":
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch: null
  schedule:
    - cron: 0 0 * * 1

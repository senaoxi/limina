        if: ${{ always() && steps.admit.outcome == 'success' }}
      - name: Retain execution receipt
        if: ${{ always() && steps.collect_receipt.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ format('ci-receipt-a{0}-{1}-{2}-{3}', github.run_attempt, env.CI_JOB, env.CI_TUPLE, env.CI_SHARD) }}
          path: .reports/ci/receipt.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
      - name: Retain test results
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ format('ci-tests-a{0}-{1}-{2}-{3}', github.run_attempt, env.CI_JOB, env.CI_TUPLE, env.CI_SHARD) }}
          path: ".smoke/test-results/**

            coverage/**"
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: ignore
  status:
    name: CI Status
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ always() }}
    needs:
      - plan
      - evals-offline
      - repository-gates
      - native-build-linux22
      - native-build
      - limina-unit
      - validation
      - platform-smoke
      - windows-behavior
      - vue-compatibility
      - docs
    env:
      CI_JOB: status
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24.15.0
          package-manager-cache: false
      - uses: ./.github/actions/ci-plan
        with:
          plan-hash: ${{ needs.plan.outputs.plan_hash }}
      - name: ci/audit
        id: audit
        run: node packages/gates/src/ci/cli.ts status
        shell: bash
      - name: Require Evals offline contracts
        if: ${{ always() }}
        env:
          EVALS_RESULT: ${{ needs.evals-offline.result }}
        run: test "$EVALS_RESULT" = success
        shell: bash
      - name: Retain final execution audit
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ format('ci-audit-a{0}-all-all', github.run_attempt) }}
          path: .reports/ci/audit.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

cleanupUnusedCatalogs: true
dedupeInjectedDeps: false
enablePrePostScripts: false
engineStrict: true
failIfNoMatch: true
hoist: false
loglevel: info
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - logaria@0.0.4
nodeVersion: 22.18.0
overrides:
  # Repair only the newly introduced deployment graph; keep both regexp API majors.
  '@vercel/fun>tar': catalog:deployment-patches
  '@vercel/node>path-to-regexp': catalog:deployment-patches-v6
  '@vercel/remix-builder>path-to-regexp': catalog:deployment-patches-v6
  '@vercel/backends>path-to-regexp': catalog:deployment-patches
  '@vercel/express>path-to-regexp': catalog:deployment-patches
  '@vercel/hono>path-to-regexp': catalog:deployment-patches
  '@vercel/fun>path-to-regexp': catalog:deployment-patches
  '@vercel/static-config>ajv': catalog:deployment-patches
  '@vercel/fun>@tootallnate/once': catalog:deployment-patches
  ajv@^8.0.0>fast-uri: catalog:security-patches
  astro@^7.0.0>devalue: catalog:security-patches
  astro@7.0.0>sharp: 0.35.4
  js-yaml@^4.0.0: 4.3.2
  '@types/node': 22.18.0
  browserslist: 4.28.7
  lodash: 4.18.0
  minimatch@^10.0.0: ^10.2.5
  minimatch@^10.0.0>brace-expansion: catalog:security-patches
  picomatch@^2.0.0: 2.3.2
  picomatch@^4.0.0: 4.0.5
  rollup-plugin-license>moment: catalog:security-patches
  undici: catalog:security-patches
  undici-types: ^6.24.0
  typescript: ~6.0.3
  shell-quote: 1.10.0
  postcss: ^8.5.23
  smol-toml: 1.7.1
packageExtensions:
  '@pnpm/manifest-utils@*':
    dependencies:
      '@pnpm/logger': 1001.0.1
patchedDependencies:
  '@vueuse/core': patches/@vueuse__core@12.8.2.patch
  vite@5.4.21: patches/vite@5.4.21.patch
  vitepress: patches/vitepress@1.6.4.patch
patchesDir: patches
publishBranch: main
sharedWorkspaceLockfile: true
shellEmulator: true
strictDepBuilds: true
strictPeerDependencies: true
trustPolicy: no-downgrade
trustPolicyExclude:
  - vite@5.4.21
  - semver
  - chokidar@4.0.3
verifyDepsBeforeRun: error
